services:
  - type: web
    name: nexora-backend
    env: node
    buildCommand: npm install && cd backend && npm install
    startCommand: node server.js
    disk:
      name: nexora-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/nexora.sqlite
